services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
      - path: env
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://mnbzsznwcybpresdnxku.supabase.co}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_Q04_oSLzhHeqLoa2Aq4_ug_jXOwyBWM}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
